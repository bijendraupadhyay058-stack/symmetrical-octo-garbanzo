[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintax-gst"
version = "1.0.2"
description = "FIN TAX PRO – Smart GST Reconciliation & ITC Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "rapidfuzz>=3.6",
    "reportlab>=4.0",
    "cryptography>=42",
    "python-docx>=1.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
postgres = ["psycopg[binary]>=3.1"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-qt>=4.4", "httpx>=0.27", "pyinstaller>=6.5"]

[project.scripts]
fintax-gst = "fintax_gst.cli:main"

[project.gui-scripts]
fintax-gst-gui = "fintax_gst.ui.app:main"

[tool.setuptools.packages.find]
include = ["fintax_gst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = ["error::DeprecationWarning:fintax_gst.*"]
