[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintax-gst"
version = "1.0.0"
description = "FIN TAX PRO – Smart GST Reconciliation & ITC Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "rapidfuzz>=3.6",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.scripts]
fintax-gst = "fintax_gst.cli:main"

[tool.setuptools.packages.find]
include = ["fintax_gst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:fintax_gst.*"]
