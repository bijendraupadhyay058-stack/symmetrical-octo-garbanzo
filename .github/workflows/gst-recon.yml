name: GST reconciliation (Python)
on:
  push:
    paths: ["gst_recon/**", ".github/workflows/gst-recon.yml"]
  pull_request:
    paths: ["gst_recon/**", ".github/workflows/gst-recon.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: gst_recon
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pandas openpyxl SQLAlchemy rapidfuzz reportlab PySide6 pytest pytest-qt
      - run: python -m pytest
      - run: python -m fintax_gst demo --out demo_output
