name: Android (DocDesk)
on:
  push:
    paths: ["docdesk-android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["docdesk-android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docdesk-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core engine tests
        run: ./gradlew :core:test
      - name: Generate sample documents (incl. .xls/.doc via LibreOffice)
        working-directory: docdesk-android/samples
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc libreoffice-writer > /dev/null
          pip install -q reportlab pypdf pillow openpyxl python-docx
          python3 make_samples.py
      - name: App tests (Robolectric engine + screen smoke tests)
        run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-report
          path: docdesk-android/app/build/reports/tests/testDebugUnitTest/
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: docdesk-debug-apk
          path: docdesk-android/app/build/outputs/apk/debug/app-debug.apk
