name: GST reconciliation (Python)
on:
  push:
    paths: ["gst_recon/**", ".github/workflows/gst-recon.yml"]
  pull_request:
    paths: ["gst_recon/**", ".github/workflows/gst-recon.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: gst_recon
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m fintax_gst demo --out demo_output

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintax
          POSTGRES_PASSWORD: fintax
          POSTGRES_DB: fintax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintax" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: gst_recon
    env:
      QT_QPA_PLATFORM: offscreen
      FINTAX_TEST_DB_URL: postgresql+psycopg://fintax:fintax@localhost:5432/fintax_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt "psycopg[binary]"
      - run: python -m pytest
      - name: Concurrent review edits (load test, PostgreSQL)
        run: |
          PGPASSWORD=fintax psql -h localhost -U fintax -d fintax_test -c "CREATE DATABASE fintax_load"
          python scripts/concurrency_load.py --db postgresql+psycopg://fintax:fintax@localhost:5432/fintax_load --workers 8 --edits 25

  windows-build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gst_recon
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      FINTAX_BUILD_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup (for the installer)
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, test and smoke-test (packaging\build_windows.ps1)
        run: .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FinTaxPro-windows
          path: |
            gst_recon/dist/installer/*.exe
            gst_recon/dist/FinTaxPro-GST/
          if-no-files-found: error
          retention-days: 14

  # Permanent download page for the desktop installer (requested by the repository owner): after every
  # successful Windows build of the development branch, the release "fintaxpro-latest" is replaced.
  release:
    needs: windows-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/ccr-34d246f0-51v3iq' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # one publish at a time: two pushes close together must not replace the release at the same moment
    concurrency:
      group: fintaxpro-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FinTaxPro-windows
          path: build
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup=$(ls build/installer/FinTaxPro-Setup-*.exe)
          gh release delete fintaxpro-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create fintaxpro-latest "$setup" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FIN TAX PRO – Windows installer (latest build)" \
            --notes "Download FinTaxPro-Setup-1.0.3.exe below and double-click it. If Windows says 'Windows protected your PC' (the installer is not code-signed yet), click More info, then Run anyway. The user guide opens after installation. Built from commit $GITHUB_SHA after all tests passed."
